<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Game Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1923; color: #e0e0e0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 40px 16px;
    }
    h1 { font-size: 28px; margin-bottom: 4px; color: #fff; }
    .subtitle { color: #8899aa; font-size: 14px; margin-bottom: 32px; }
    .games-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 16px; width: 100%; max-width: 400px;
    }
    .game-card {
      background: #1a2a3a; border-radius: 14px; padding: 20px;
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: inherit;
      transition: all 0.2s; border: 2px solid transparent;
    }
    .game-card:active { transform: scale(0.97); }
    .game-card:hover { border-color: #e74c3c; background: #1e3044; }
    .game-icon { font-size: 36px; flex-shrink: 0; }
    .game-info h3 { font-size: 18px; margin-bottom: 4px; color: #fff; }
    .game-info p { font-size: 13px; color: #8899aa; }
    .players-badge {
      background: #2a3a4a; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; color: #99aabb; margin-top: 6px; display: inline-block;
    }
    .settings-section {
      margin-top: 40px; width: 100%; max-width: 400px;
      background: #1a2a3a; border-radius: 12px; padding: 16px;
    }
    .settings-section h4 { font-size: 14px; color: #8899aa; margin-bottom: 10px; }
    .settings-row { display: flex; gap: 8px; }
    .settings-row input {
      flex: 1; padding: 10px 14px; border: 2px solid #2a3a4a;
      border-radius: 8px; background: #0f1923; color: #fff;
      font-size: 14px; outline: none;
    }
    .settings-row input:focus { border-color: #3498db; }
    .settings-row button {
      padding: 10px 16px; border: none; border-radius: 8px;
      background: #2ecc71; color: #fff; font-weight: 600; cursor: pointer;
      font-size: 13px; white-space: nowrap;
    }
    .settings-row button:active { transform: scale(0.97); }
    #statusMsg { margin-top: 8px; font-size: 12px; color: #2ecc71; min-height: 18px; }
  </style>
</head>
<body>
  <h1>🎮 Game Hub</h1>
  <p class="subtitle">Multiplayer games — play with friends!</p>

  <div class="games-grid">
    <a href="games/battlefield/" class="game-card">
      <div class="game-icon">⚔️</div>
      <div class="game-info">
        <h3>Battlefield</h3>
        <p>Turn-based territory conquest. Conquer the board, defeat your friends!</p>
        <span class="players-badge">👥 2–6 players</span>
      </div>
    </a>

    <!-- More games go here -->
    <!--
    <a href="games/next-game/" class="game-card">
      <div class="game-icon">🎯</div>
      <div class="game-info">
        <h3>Next Game</h3>
        <p>Coming soon...</p>
      </div>
    </a>
    -->
  </div>

  <div class="settings-section">
    <h4>⚙️ Backend Server</h4>
    <p style="font-size:12px;color:#667;margin-bottom:10px">Set the server URL for real-time games (set once, saved to device)</p>
    <div class="settings-row">
      <input type="text" id="backendUrl" placeholder="https://example.lhr.life">
      <button onclick="saveBackend()">Save</button>
    </div>
    <div id="statusMsg"></div>
  </div>

  <script>
    // Load saved backend URL
    const saved = localStorage.getItem('BF_BACKEND');
    if (saved) document.getElementById('backendUrl').value = saved;

    function saveBackend() {
      const url = document.getElementById('backendUrl').value.trim();
      if (!url) {
        localStorage.removeItem('BF_BACKEND');
        document.getElementById('statusMsg').textContent = '✓ Using default (same origin)';
      } else {
        localStorage.setItem('BF_BACKEND', url);
        document.getElementById('statusMsg').textContent = '✓ Saved! All games will use this server.';
      }
      setTimeout(() => document.getElementById('statusMsg').textContent = '', 3000);
    }
  </script>
</body>
</html>
